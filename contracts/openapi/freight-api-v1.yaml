    # ── Offers ──────────────────────────────

    CreateOfferRequest:
      type: object
      required: [vehicleId, amount, currency]
      properties:
        vehicleId:
          type: string
          format: uuid
        amount:
          type: integer
          format: int64
          minimum: 1
          description: Taklif narxi (integer, floating point emas)
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        message:
          type: string
          maxLength: 1000
          description: Ixtiyoriy xabar

    Offer:
      type: object
      required:
        - id
        - loadId
        - status
        - amount
        - currency
        - version
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        loadId:
          type: string
          format: uuid
        creatorUserId:
          type: string
          format: uuid
        creatorCompanyId:
          type: ['string', 'null']
          format: uuid
        driverProfileId:
          type: string
          format: uuid
        vehicleId:
          type: string
          format: uuid
        amount:
          type: integer
          format: int64
        currency:
          type: string
        message:
          type: ['string', 'null']
        status:
          type: string
          enum: [PENDING, ACCEPTED, REJECTED, WITHDRAWN, EXPIRED]
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

