              items:
                $ref: '#/components/schemas/Offer'

    # ── Shipments ───────────────────────────

    UpdateShipmentStatusRequest:
      type: object
      required: [status, expectedVersion]
      properties:
        status:
          type: string
          enum:
            - HEADING_TO_PICKUP
            - AT_PICKUP
            - LOADED
            - IN_TRANSIT
            - DELIVERED
            - COMPLETED
          description: Target status (state machine bo'yicha valid transition bo'lishi kerak)
        expectedVersion:
          type: integer
          format: int64
          description: Concurrency guard — joriy shipment version

    Shipment:
      type: object
      required:
        - id
        - offerId
        - loadId
        - status
        - acceptedPrice
        - version
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        offerId:
          type: string
          format: uuid
        loadId:
          type: string
          format: uuid
        shipperUserId:
          type: ['string', 'null']
          format: uuid
        shipperCompanyId:
          type: ['string', 'null']
          format: uuid
        assignment:
          $ref: '#/components/schemas/ShipmentAssignment'
        acceptedPrice:
          $ref: '#/components/schemas/Money'
        status:
          type: string
          enum:
            - CREATED
            - DRIVER_ASSIGNED
            - HEADING_TO_PICKUP
            - AT_PICKUP
            - LOADED
            - IN_TRANSIT
            - DELIVERED
            - COMPLETED
        stops:
          type: array
          items:
            $ref: '#/components/schemas/ShipmentStop'
          description: Execution uchun load stoplari snapshot
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        assignedAt:
          type: ['string', 'null']
          format: date-time
        deliveredAt:
          type: ['string', 'null']
          format: date-time
        completedAt:
          type: ['string', 'null']
          format: date-time

    ShipmentAssignment:
      type: object
      required: [driverUserId, driverProfileId, vehicleId]
      properties:
        driverUserId:
          type: string
          format: uuid
        driverProfileId:
          type: string
          format: uuid
        carrierCompanyId:
          type: ['string', 'null']
          format: uuid
        vehicleId:
          type: string
          format: uuid

    ShipmentStop:
      type: object
      required: [id, type, sequence, address, location]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [PICKUP, DELIVERY, INTERMEDIATE]
        sequence:
          type: integer
        address:
          type: string
        location:
          $ref: '#/components/schemas/GeoPoint'
        contactName:
          type: ['string', 'null']
        contactPhone:
          type: ['string', 'null']
        scheduledFrom:
          type: ['string', 'null']
          format: date-time
        scheduledTo:
          type: ['string', 'null']
          format: date-time

    ShipmentStatusHistoryEntry:
      type: object
      required: [id, previousStatus, newStatus, changedAt]
      properties:
        id:
          type: string
          format: uuid
        previousStatus:
          type: ['string', 'null']
          description: Birinchi entry uchun null
        newStatus:
          type: string
          enum:
            - CREATED
            - DRIVER_ASSIGNED
