    UserCompanyContext:
      type: object
      required: [companyId, companyName, memberId, roles, permissions]
      properties:
        companyId:
          type: string
          format: uuid
        companyName:
          type: string
        memberId:
          type: string
          format: uuid
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleSummary'
        permissions:
          type: array
          items:
            type: string
          description: Company-scoped effective permission codlari (faqat UX uchun)

    # ── Feature Capabilities ────────────────

    FeatureCapabilities:
      type: object
      properties:
        liveTracking:
          type: boolean
