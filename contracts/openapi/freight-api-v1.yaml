    SupportedCurrency:
      type: object
      required: [code, label, isDefault]
      properties:
        code:
          type: string
          pattern: "^[A-Z]{3}$"
          example: "UZS"
        label:
          type: string
          example: "O'zbek so'mi"
        isDefault:
          type: boolean

    # ── Own Load Page ───────────────────────

    OwnLoadPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Load'
