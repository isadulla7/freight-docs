        body:
          type: string
          minLength: 1
          maxLength: 4000

    Message:
      type: object
      required: [id, conversationId, senderUserId, contentType, body, createdAt]
      properties:
        id:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        senderUserId:
          type: string
          format: uuid
        contentType:
          type: string
          enum: [TEXT]
        body:
          type: string
        createdAt:
          type: string
          format: date-time

    MessagePage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Message'

    # ── Notifications ───────────────────────

    Notification:
      type: object
      required: [id, type, createdAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          description: "Bildirishnoma turi (masalan: OFFER_CREATED, OFFER_ACCEPTED, SHIPMENT_STATUS_CHANGED)"
        title:
