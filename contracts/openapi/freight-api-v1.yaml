            - AT_PICKUP
            - LOADED
            - IN_TRANSIT
            - DELIVERED
            - COMPLETED
        actorUserId:
          type: ['string', 'null']
          format: uuid
          description: "null = system action"
        reasonCode:
          type: ['string', 'null']
        changedAt:
          type: string
          format: date-time

    ShipmentSummary:
      type: object
      required: [id, status, acceptedPrice, createdAt]
      properties:
        id:
          type: string
          format: uuid
        loadId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - CREATED
            - DRIVER_ASSIGNED
            - HEADING_TO_PICKUP
            - AT_PICKUP
            - LOADED
            - IN_TRANSIT
            - DELIVERED
            - COMPLETED
        acceptedPrice:
          $ref: '#/components/schemas/Money'
        pickupAddress:
          type: string
        deliveryAddress:
          type: string
        assignment:
          $ref: '#/components/schemas/ShipmentAssignment'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ShipmentPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ShipmentSummary'

    # ── Conversations ───────────────────────

    Conversation:
      type: object
      required: [id, shipmentId, status, participants, createdAt]
      properties:
