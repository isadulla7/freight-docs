    PushEndpoint:
      type: object
      required: [id, deviceId, provider, createdAt]
      properties:
        id:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
        provider:
          type: string
        createdAt:
          type: string
          format: date-time

    # ── User Context ────────────────────────

    UserContext:
      type: object
      required: [user, permissions, features]
      properties:
        user:
          $ref: '#/components/schemas/UserProfile'
        driverProfile:
          $ref: '#/components/schemas/DriverProfileSummary'
        companies:
          type: array
          items:
            $ref: '#/components/schemas/UserCompanyContext'
        permissions:
          type: array
          items:
            type: string
          description: Effective global permission codlari (faqat UX uchun)
        features:
          $ref: '#/components/schemas/FeatureCapabilities'

    DriverProfileSummary:
      type: object
      required: [id, verificationStatus]
      properties:
        id:
          type: string
          format: uuid
